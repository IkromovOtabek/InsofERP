# Markaziy IT panel: admin.insof-erp.uz → 127.0.0.1:3100 (insof-control.service)
# O'rnatish:
#   sudo install -m 644 docs/deploy/nginx-limits.conf /etc/nginx/conf.d/insof-limits.conf   # bir marta
#   sudo install -m 644 docs/deploy/nginx-control.conf /etc/nginx/sites-available/insof-control
#   sudo ln -sf /etc/nginx/sites-available/insof-control /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.insof-erp.uz --redirect
server {
    listen 80;
    server_name admin.insof-erp.uz;
    server_tokens off;
    client_max_body_size 2m;

    # Tavsiya: panelni faqat ofis / VPN IP'laridan ochish
    # allow 203.0.113.10;
    # deny all;

    # Sarlavhalar server darajasida (location'larda proxy_set_header yozmang — meros bekor bo'ladi)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;   # yangi korxona yaratish (baza + migratsiya) bir necha soniya oladi

    location ^~ /superadmin/login {
        limit_req zone=insof_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }
    location = /api/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3100;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
