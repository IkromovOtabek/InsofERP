# Insof platformasi — kengaytirilgan access.log formati (nginx `http {}` darajasi, conf.d orqali).
# IT panel → «Trafik» sahifasi domen bo'yicha ajratish ($host) va eng sekin yo'llar ($request_time) uchun.
# Format `combined` bilan boshi bir xil — fail2ban, goaccess kabi vositalar avvalgidek o'qiydi; qo'shimchalar qator oxirida.
#
# O'rnatish (bir marta; PLATFORMA.md → «Baza va trafik»):
#   sudo install -m 644 docs/deploy/nginx-log.conf /etc/nginx/conf.d/insof-log.conf
#   # nginx.conf dagi standart access_log qatorini o'chirish (aks holda har so'rov IKKI marta yoziladi):
#   sudo sed -i 's|^\(\s*\)access_log /var/log/nginx/access.log;|\1# insof-log.conf ga ko'\''chirildi: access_log /var/log/nginx/access.log;|' /etc/nginx/nginx.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Qaytarish: sudo rm /etc/nginx/conf.d/insof-log.conf, nginx.conf dagi izohni olib tashlang, nginx -t && reload.

log_format insof_main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'host=$host rt=$request_time urt="$upstream_response_time"';
access_log /var/log/nginx/access.log insof_main;
