# scripts/tenant-up.sh shu shablondan /etc/nginx/sites-available/insof-<slug> yaratadi: __DOMAIN__, __PORT__
# Talab: /etc/nginx/conf.d/insof-limits.conf (docs/deploy/nginx-limits.conf) — insof_* zonalari.
# SSL (listen 443) qismini certbot --nginx o'zi qo'shadi.
server {
    listen 80;
    server_name __DOMAIN__;
    server_tokens off;

    # Ilovadagi chegaralar bilan bir xil: server action / middleware 16 MB (next.config.ts),
    # imzolangan shartnoma 15 MB gacha, nakladnoy surati ~6 MB.
    client_max_body_size 16m;

    # Proxy sarlavhalari server darajasida — barcha location'lar meros oladi.
    # DIQQAT: location ichida bitta proxy_set_header yozilsa, meros BEKOR bo'ladi — u yerda yozmang.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Mijoz yuborgan X-Forwarded-For TASHLANADI va haqiqiy IP bilan almashtiriladi — login qulfi
    # soxta IP bilan aylanib o'tilmasin (ilova avval X-Real-IP, keyin XFF ning oxirgisini oladi: lib/login-guard.ts)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;

    # ── Tezlik cheklovi ──
    location ^~ /login {
        limit_req zone=insof_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
    }
    location ^~ /api/mobile/auth/ {
        limit_req zone=insof_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
    }
    location ^~ /api/public/ {
        limit_req zone=insof_pub burst=30 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
    }
    location ^~ /verify/ {
        limit_req zone=insof_pub burst=30 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
    }
    location ^~ /api/ai {
        limit_req zone=insof_ai burst=5 nodelay;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:__PORT__;
    }
    location ^~ /api/mobile/ai {
        limit_req zone=insof_ai burst=5 nodelay;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:__PORT__;
    }
    # Holat tekshiruvi tashqariga ochilmaydi: deploy.sh / health-watch.sh 127.0.0.1:<port> ga to'g'ridan-to'g'ri boradi
    location = /api/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:__PORT__;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
    }
}
