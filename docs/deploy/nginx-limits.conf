# Insof platformasi — so'rov tezligi cheklovi zonalari (nginx `http {}` darajasi).
# O'rnatish (bir marta; scripts/tenant-up.sh o'zi qiladi):
#   sudo install -m 644 docs/deploy/nginx-limits.conf /etc/nginx/conf.d/insof-limits.conf
# Nomlar `insof_` bilan — server-xavfsizlik.md 3.4 dagi eski `auth`/`pub` zonalari bilan to'qnashmaydi.
# Kalit $binary_remote_addr — nginx o'zi ko'rgan IP (mijoz yuborgan X-Forwarded-For hisobga olinmaydi).

# Login, parol tiklash, mobil auth, IT panel kirishi: bitta IP dan daqiqasiga 30 so'rov
limit_req_zone $binary_remote_addr zone=insof_auth:10m rate=30r/m;
# Ochiq API (do'kon, QR tekshiruv): daqiqasiga 120
limit_req_zone $binary_remote_addr zone=insof_pub:10m rate=120r/m;
# AI savollar (pullik model tokeni): daqiqasiga 20
limit_req_zone $binary_remote_addr zone=insof_ai:10m rate=20r/m;
limit_req_status 429;
limit_req_log_level warn;
